<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sistem Presensi Halaqah Al-Atsar</title>
  <link href="/src/style.css" rel="stylesheet">
</head>
<body class="bg-gray-50 text-gray-900 font-sans min-h-screen">
  
  <div id="app" class="max-w-4xl mx-auto p-4 md:p-6">
    <!-- Header -->
    <header class="flex justify-between items-center mb-8 bg-white p-4 rounded-lg shadow-sm border border-gray-100">
      <div>
        <h1 class="text-2xl font-bold text-green-700">Presensi Halaqah</h1>
        <p class="text-sm text-gray-500">Al-Atsar</p>
      </div>
      <div id="auth-section">
        <button id="btn-login" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded font-medium transition">Login Musyrif</button>
        <button id="btn-logout" class="hidden text-red-600 hover:bg-red-50 px-4 py-2 rounded font-medium transition">Logout</button>
      </div>
    </header>

    <!-- Main Content -->
    <main class="bg-white p-6 rounded-lg shadow-sm border border-gray-100">
      
      <!-- Controls -->
      <div class="grid grid-cols-1 md:grid-cols-3 gap-4 mb-6">
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Tanggal</label>
          <input type="date" id="input-date" class="w-full border border-gray-300 rounded p-2 focus:ring-green-500 focus:border-green-500" />
        </div>
        <div>
          <label class="block text-sm font-medium text-gray-700 mb-1">Sesi</label>
          <select id="input-session" class="w-full border border-gray-300 rounded p-2 focus:ring-green-500 focus:border-green-500">
            <option value="pagi">Pagi</option>
            <option value="siang">Siang</option>
            <option value="malam">Malam</option>
          </select>
        </div>
        <div class="flex items-end">
          <button id="btn-load" class="w-full bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded font-medium transition">
            Tampilkan Data
          </button>
        </div>
      </div>

      <!-- Loading state -->
      <div id="loading" class="hidden text-center py-8 text-gray-500">
        Memuat data...
      </div>

      <!-- Table -->
      <div id="table-container" class="hidden overflow-x-auto">
        <form id="attendance-form">
          <table class="min-w-full divide-y divide-gray-200">
            <thead class="bg-gray-50">
              <tr>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">ID Siswa</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Nama</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Kelas</th>
                <th scope="col" class="px-6 py-3 text-left text-xs font-medium text-gray-500 uppercase tracking-wider">Status</th>
              </tr>
            </thead>
            <tbody id="table-body" class="bg-white divide-y divide-gray-200">
              <!-- Rows injected by JS -->
            </tbody>
          </table>
          
          <div class="mt-6 flex justify-end">
            <button type="submit" id="btn-save" class="hidden bg-green-600 hover:bg-green-700 text-white px-6 py-2 rounded font-medium transition shadow-sm">
              Simpan Presensi
            </button>
          </div>
        </form>
      </div>

    </main>
  </div>

  <!-- Login Modal -->
  <div id="login-modal" class="hidden fixed inset-0 bg-gray-900 bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow-xl p-6 w-full max-w-sm">
      <h2 class="text-xl font-bold mb-4 text-center">Login Musyrif</h2>
      <div id="login-error" class="hidden bg-red-100 text-red-700 p-2 rounded text-sm mb-4"></div>
      <form id="login-form">
        <div class="mb-4">
          <label class="block text-sm font-medium text-gray-700 mb-1">Username</label>
          <input type="text" id="login-username" required class="w-full border border-gray-300 rounded p-2" />
        </div>
        <div class="mb-6">
          <label class="block text-sm font-medium text-gray-700 mb-1">Password</label>
          <input type="password" id="login-password" required class="w-full border border-gray-300 rounded p-2" />
        </div>
        <div class="flex justify-end gap-2">
          <button type="button" id="btn-close-login" class="text-gray-600 hover:bg-gray-100 px-4 py-2 rounded transition">Batal</button>
          <button type="submit" class="bg-green-600 hover:bg-green-700 text-white px-4 py-2 rounded transition">Login</button>
        </div>
      </form>
    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>
</html>
